[package]
name = "thouless-lapack"
version = "0.0.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
publish = false

[dependencies]
lapack = "0.20.0"
num-complex = "0.4.6"

[target.'cfg(target_os = "macos")'.dependencies]
lapack-src = { version = "0.13.0", default-features = false, features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
lapack-src = { version = "0.13.0", default-features = false, features = ["netlib"] }
