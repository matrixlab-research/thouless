[package]
name = "thouless-lapack"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "LAPACK-backed decomposition kernels for Thouless"
repository = "https://github.com/matrixlab-research/thouless"

[dependencies]
lapack = "0.20.0"
num-complex = "0.4.6"

[target.'cfg(target_os = "macos")'.dependencies]
lapack-src = { version = "0.13.0", default-features = false, features = ["accelerate"] }

[target.'cfg(all(not(target_os = "macos"), not(target_os = "windows")))'.dependencies]
lapack-src = { version = "0.13.0", default-features = false, features = ["netlib"] }

[target.'cfg(target_os = "windows")'.dependencies]
lapack-src = { version = "0.13.0", default-features = false, features = ["intel-mkl-static-sequential"] }
