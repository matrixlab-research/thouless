schema_version = 1
contract_version = "0.1.0"
crate = "thouless"
status = "stable"
public_api_test = "tests/native_public_api.rs"
stability_document = "docs/api-stability.md"
precision = "real and complex binary64"
ownership = "scientific objects own structural data; accessors borrow; computed results are owned"
coordinates = "primitive vectors are Cartesian rows; orbital positions and momenta are reduced unless explicitly Cartesian"
errors = "Result with non-exhaustive domain errors"

[[workflow]]
id = "differentiation.affine_projector"
module = "thouless::ad"
symbols = ["ModelParameters", "ModelDirection", "ModelGradient", "AffineHermitianFamily", "SpectralProjectorObjective"]
validation = ["tests/native_ad.rs"]

[[workflow]]
id = "model.structure"
module = "thouless::model"
symbols = ["Lattice", "OrbitalId", "ModelBuilder", "TightBindingModel"]
validation = ["tests/native_model.rs"]

[[workflow]]
id = "spectrum.periodic"
module = "thouless::model; thouless::spectrum"
symbols = ["TightBindingModel::hamiltonian", "TightBindingModel::eigensystem", "TightBindingModel::band_structure", "Eigensystem"]
validation = ["tests/native_model.rs"]

[[workflow]]
id = "spectrum.kernel_polynomial"
module = "thouless::linear_operator; thouless::kpm"
symbols = ["LinearOperator", "CsrMatrix", "SpectralScale", "rescale_sparse_hamiltonian", "chebyshev_vectors", "reconstruct"]
validation = ["tests/native_kpm.rs", "src/kpm.rs"]

[[workflow]]
id = "spectrum.lead_bands"
module = "thouless::bands"
symbols = ["PeriodicBands", "BandEvaluation"]
validation = ["src/bands.rs"]

[[workflow]]
id = "geometry.finite"
module = "thouless::transform"
symbols = ["FiniteSite", "FiniteGeometry", "make_finite_geometry", "make_finite_cluster", "make_supercell", "remove_orbitals"]
validation = ["tests/native_transform.rs"]

[[workflow]]
id = "geometry.periodic_folding"
module = "thouless::periodic"
symbols = ["PeriodicTerm", "bloch_phase", "fold_terms"]
validation = ["tests/native_periodic.rs", "src/periodic.rs"]

[[workflow]]
id = "visualization.regular_field"
module = "thouless::interpolation"
symbols = ["SmoothingOptions", "RegularField", "interpolate_density", "interpolate_current"]
validation = ["src/interpolation.rs"]

[[workflow]]
id = "continuum.finite_difference"
module = "thouless::continuum"
symbols = ["DifferentialFactor", "DifferentialStencilTerm", "finite_difference_stencil", "landau_ladder_coefficient"]
validation = ["src/continuum.rs"]

[[workflow]]
id = "geometry.reciprocal_sampling"
module = "thouless::geometry"
symbols = ["ReciprocalPath", "UniformReciprocalMesh"]
validation = ["tests/native_geometry.rs"]

[[workflow]]
id = "geometry.topology"
module = "thouless::topology"
symbols = ["wilson_line_phase", "wilson_loop_eigenphases", "chern_numbers_on_uniform_grid", "z2_invariant_on_uniform_grid", "second_chern_from_hamiltonian_derivatives"]
validation = ["tests/native_topology.rs"]

[[workflow]]
id = "geometry.quantum_geometric_tensor"
module = "thouless::topology"
symbols = ["QuantumGeometricTensor", "quantum_geometric_tensor_from_hamiltonian_derivatives"]
validation = ["tests/native_topology.rs"]

[[workflow]]
id = "geometry.local_chern_marker"
module = "thouless::topology"
symbols = ["local_chern_marker_from_projector", "local_chern_marker_from_hamiltonian"]
validation = ["tests/native_topology.rs"]

[[workflow]]
id = "geometry.wannier"
module = "thouless::wannier"
symbols = ["project_trials", "disentangle_subspace", "periodic_overlaps", "spread_decomposition", "maximize_localization", "inverse_bloch_transform", "interpolate_periodic_matrices"]
validation = ["tests/native_wannier.rs"]

[[workflow]]
id = "response.intrinsic"
module = "thouless::response"
symbols = ["FermiDistribution", "BandResponsePoint", "UniformMeshBandResponse", "band_response_from_model", "berry_curvature_dipole"]
