schema_version = 1
status = "proposal"
question_count = 100
suite_count = 20
benchmark_repository = "https://github.com/matrixlab-research/thouless-benchmark"
benchmark_commit = "62f5e9b9ca7b3810275fa088637f0adae74aca7d"
design_document = "docs/domain-100-native-api-design.md"
stable_contract = "spec/api/thouless-native.toml"
tracking_issue = "https://github.com/matrixlab-research/thouless/issues/17"
coverage_kind = "composable design coverage, not implementation coverage"

[[concept]]
id = "model.family"
status = "partial"
summary = "Optional typed physical parameterization bound to an immutable model"
issue = "https://github.com/matrixlab-research/thouless/issues/17"

[[concept]]
id = "system.views"
status = "partial"
summary = "Concrete periodic, finite, open, driven, and self-consistent system types"
issue = "https://github.com/matrixlab-research/thouless/issues/17"

[[concept]]
id = "compute.request"
status = "missing"
summary = "Typed scientific output request with a system-specific result"
issue = "https://github.com/matrixlab-research/thouless/issues/17"

[[concept]]
id = "study.axes"
status = "missing"
summary = "Iterator-compatible sweeps, ensembles, and refinement ladders"
issue = "https://github.com/matrixlab-research/thouless/issues/17"

[[concept]]
id = "compute.context"
status = "partial"
summary = "Optional accuracy, resource, backend, deterministic, and reusable-state policy"
issue = "https://github.com/matrixlab-research/thouless/issues/17"

[[concept]]
id = "compute.report"
status = "partial"
summary = "Value plus validity, convergence, error, resource, and provenance evidence"
issue = "https://github.com/matrixlab-research/thouless/issues/17"

[[concept]]
id = "differentiate.objective"
status = "partial"
summary = "Optional physical parameter spaces and scalar objectives for native AD and inference"
issue = "https://github.com/matrixlab-research/thouless/issues/13"

[[request_family]]
id = "spectrum"
module = "thouless::spectrum"
examples = ["Bands", "TargetedStates", "DensityOfStates", "FermiSurface"]

[[request_family]]
id = "topology"
module = "thouless::topology"
examples = ["BulkInvariant", "WilsonFlow", "LocalMarker", "NonBlochInvariant"]

[[request_family]]
id = "localization"
module = "thouless::localization"
examples = ["Participation", "LevelStatistics", "LocalizationLength", "MobilityEdge"]

[[request_family]]
id = "observables"
module = "thouless::observables"
examples = ["LocalDensity", "LocalCurrent", "Torque", "Correlation"]

[[request_family]]
id = "response"
module = "thouless::response"
examples = ["LinearResponse", "NonlinearResponse", "OpticalResponse", "ThermoelectricResponse"]

[[request_family]]
id = "transport"
module = "thouless::transport"
examples = ["Scattering", "LocalTransport", "Noise", "Embedding"]

[[request_family]]
id = "dynamics"
module = "thouless::dynamics"
examples = ["Evolution", "FloquetSpectrum", "Pumping"]

[[request_family]]
id = "mean_field"
module = "thouless::mean_field"
examples = ["SelfConsistentStates", "CompetingOrders"]

[[request_family]]
id = "inference"
module = "thouless::inference"
examples = ["Fit", "Identifiability", "Design"]

