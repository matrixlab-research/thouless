schema_version = 1
contract_version = "0.1.0"
status = "stable"
description = "Target namespaces for the stable Rust, Python, and Julia scientific workflows"

[languages]
rust = "thouless"
python = "thouless"
julia = "Thouless"

[tracking]
rust_contract = "https://github.com/matrixlab-research/thouless/issues/7"
python_native = "https://github.com/matrixlab-research/thouless/issues/8"
julia_native = "https://github.com/matrixlab-research/thouless/issues/9"
cross_language_ci = "https://github.com/matrixlab-research/thouless/issues/10"

[[workflow]]
id = "model.structure"
rust = "thouless::model"
python = "thouless.model"
julia = "Thouless.Model"

[[workflow]]
id = "spectrum.periodic"
rust = "thouless::model; thouless::spectrum"
python = "thouless.spectrum"
julia = "Thouless.Spectrum"

[[workflow]]
id = "spectrum.kernel_polynomial"
rust = "thouless::linear_operator; thouless::kpm"
python = "thouless.kpm"
julia = "Thouless.KPM"

[[workflow]]
id = "spectrum.lead_bands"
rust = "thouless::bands"
python = "thouless.spectrum"
julia = "Thouless.Spectrum"

