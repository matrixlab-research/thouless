schema_version = 1
overall_status = "Incomplete"

[[capability]]
id = "model.structure"
description = "Shared periodic or finite lattice, orbital, onsite, and hopping representation"
native_api = "thouless::model"
test = "tests/native_model.rs scalar, block-orbital, finite, embedded periodic, invalid-structure, and 16 generated multiorbital model families"
status = "implemented"

[[capability]]
id = "spectrum.periodic"
description = "Bloch Hamiltonian assembly and divide-and-conquer Hermitian eigensolvers"
native_api = "thouless::model::TightBindingModel::{hamiltonian,eigensystem,momentum_derivatives}"
test = "tests/native_model.rs generated Hermiticity, eigensystem residual, orthogonality, trace, analytic-derivative, and reciprocal-periodicity properties; crates/thouless-lapack tests; and pinned PythTB spectral workflows"
status = "implemented"

[[capability]]
id = "spectrum.kernel_polynomial"
description = "Kernel-polynomial spectral densities, operator-resolved moments, quadrature, and Kubo-Bastin two-operator response"
native_api = "thouless::linear_operator::{LinearOperator,CsrMatrix} and thouless::kpm::{rescale_sparse_hamiltonian,estimate_spectral_bounds,chebyshev_vectors,scalar_moments_with_operator,reconstruct,sparse_velocity_operator,correlation_moments,correlation_integral_factor,correlation_response}"
test = "src/kpm.rs dense-versus-CSR equivalence, 100000-dimensional O(nnz) recurrence, sparse velocity, trace-sum, rescaling, and response invariants; tests/native_kpm.rs; no-dense compatibility boundary; and complete pinned Kwant KPM module"
status = "implemented"

[[capability]]
id = "spectrum.lead_bands"
description = "Periodic principal-cell band energies, eigenvectors, velocities, and curvatures"
native_api = "thouless::bands::{PeriodicBands,BandEvaluation}"
test = "src/bands.rs analytic derivative tests and complete pinned Kwant dispersion module"
status = "implemented"

[[capability]]
id = "geometry.finite"
description = "Cuts, arbitrary finite shapes, defects, disorder, and boundaries"
native_api = "thouless::transform::{make_finite_geometry,make_finite_cluster,replace_onsite_blocks,remove_orbitals,make_supercell,change_nonperiodic_vector,FiniteSite,FiniteGeometry}"
test = "tests/native_transform.rs analytic open-chain spectrum, incomplete boundary cells, vacancy-split spectrum, onsite disorder with invariant connectivity, supercell folding, vector changes, and pinned PythTB transformed-model workflows"
status = "implemented"

[[capability]]
id = "geometry.periodic_folding"
description = "Bloch-phase folding of periodic hopping terms into finite or lower-dimensional matrix blocks"
native_api = "thouless::periodic::{PeriodicTerm,bloch_phase,fold_terms}"
test = "src/periodic.rs, tests/native_periodic.rs, repository cosine-chain boundary, and pinned Kwant wraparound model tests"
status = "implemented"

[[capability]]
id = "visualization.regular_field"
description = "Compact-support scalar-density and oriented bond-current interpolation on regular Cartesian fields"
native_api = "thouless::interpolation::{interpolate_density,interpolate_current,SmoothingOptions,RegularField}"
test = "src/interpolation.rs linearity, compact support, padded-border, and current-orientation properties plus complete pinned Kwant plotter and two-dimensional band-plot tests"
status = "implemented"

[[capability]]
id = "continuum.finite_difference"
description = "Symbolic-frontend-independent centered finite-difference stencils for ordered coefficient and momentum products, plus truncated Landau ladder matrix elements"
native_api = "thouless::continuum::{finite_difference_stencil,landau_ladder_coefficient,DifferentialFactor,DifferentialStencilTerm,ShiftedCoefficient,RationalShift}"
test = "src/continuum.rs nearest-neighbor grid shortening, half-grid divergence-form, operator ordering, Landau truncation, and magnetic-field orientation properties plus complete pinned Kwant continuum common, discretizer, and Landau-level modules"
status = "implemented"

[[capability]]
id = "geometry.reciprocal_sampling"
description = "Metric-aware reciprocal paths and uniform tensor-product meshes with normalized and Cartesian quadrature measures"
native_api = "thouless::geometry::{ReciprocalPath,UniformReciprocalMesh}"
test = "tests/native_geometry.rs anisotropic path metric, short-segment node preservation, oblique two-dimensional mesh coordinates and volume, embedded lower-dimensional measure, and invalid-grid boundaries"
status = "implemented"

[[capability]]
id = "geometry.topology"
description = "Berry geometry, Wilson loops, reduced polarization, hybrid Wannier centers, first and second Chern invariants, and two-dimensional time-reversal Z2 flow"
native_api = "thouless::topology link, Wilson-loop, hybrid-Wannier, polarization, largest-gap Z2, principal unitary-power, connection, flux, first-Chern, and Kubo second-Chern functions"
test = "tests/native_topology.rs gauge and basis invariants, atomic polarization, analytic tensors, quantized first and second Chern models, synthetic even/odd partner switching, mesh-stable quantum-spin-Hall Z2 classification, holonomy-root reconstruction, and pinned PythTB topology/link tests"
status = "implemented"

[[capability]]
id = "geometry.quantum_geometric_tensor"
description = "Abelian and non-Abelian Kubo quantum geometric tensor, Berry curvature, and quantum metric for occupied subspaces"
native_api = "thouless::topology::{quantum_geometric_tensor_from_hamiltonian_derivatives,QuantumGeometricTensor}"
test = "tests/native_topology.rs massive Dirac analytic tensor plus PythTB compatibility differential evaluation at generic momentum"
status = "implemented"

[[capability]]
id = "geometry.local_chern_marker"
description = "Bianco-Resta local Chern marker from either an occupied projector or a finite Hamiltonian and occupied eigenstate indices"
native_api = "thouless::topology::{local_chern_marker_from_projector,local_chern_marker_from_hamiltonian}"
test = "tests/native_topology.rs projector-gauge equivalence and compat-tests/test_pythtb_api.py finite Haldane bulk marker"
status = "implemented"

[[capability]]
id = "geometry.wannier"
description = "Gauge-covariant trial projection, fixed-rank SMV subspace disentanglement with frozen manifolds, periodic sampled-frame overlaps, Marzari-Vanderbilt spread decomposition and maximal localization, multidimensional Bloch transforms, frame-projected operators, and periodic matrix interpolation"
native_api = "thouless::wannier::{project_trials,disentangle_subspace,periodic_overlaps,spread_decomposition,maximize_localization,inverse_bloch_transform,operators_in_frames,interpolate_periodic_matrices}"
test = "tests/native_wannier.rs gauge independence, frozen-manifold preservation, embedded atomic zero-spread invariant, two-dimensional composite-gauge localization, and unseen off-mesh matrix interpolation plus PythTB SSH differential workflow"
status = "partial"
issue = "https://github.com/matrixlab-research/thouless/issues/2"

[[capability]]
id = "response.intrinsic"
description = "Band-resolved Kubo Berry curvature, coordinate-consistent uniform-mesh integration of linear Hall geometry, and finite-temperature Berry-curvature-dipole integrals"
native_api = "thouless::response::{band_response_from_hamiltonian_derivatives,band_response_from_model,occupation_weighted_berry_curvature,berry_curvature_dipole,FermiDistribution,BandResponsePoint,UniformMeshBandResponse}"
test = "tests/native_response.rs massive-Dirac analytic curvature, constant-basis invariance, reduced-versus-Cartesian model derivatives and mesh measures, quantized Qi-Wu-Zhang integral, inversion cancellation of the dipole, tilted-Dirac Fermi-surface dipole, degeneracy rejection, and zero-temperature distribution boundary"
status = "partial"
issue = "https://github.com/matrixlab-research/thouless/issues/2"

[[capability]]
id = "observables.local"
description = "Block-sparse site densities, oriented bond currents, onsite sources, bilinear evaluation, basis projection, and position operators"
native_api = "thouless::observables::{LocalBasisLayout,LocalOperatorSet,local_densities,bond_currents,local_sources,project_diagonal_observable}"
test = "tests/native_observables.rs mixed-site evaluation, exact local continuity, conserved-current antisymmetry, independent-site gauge covariance, validation boundaries, projection, and Pauli decomposition; Rust-path compatibility smoke; and complete pinned Kwant operator plus PythTB position and Pauli workflows"
status = "implemented"

[[capability]]
id = "transport.steady_state"
description = "Leads, modes, self-energies, Green functions, scattering, and local observables"
native_api = "thouless::transport::{LeadContact,LocalizedSelfEnergy,SparseOpenSystem,surface_green_function,open_system_self_energies,open_system_extrapolated_self_energies,solve_open_system_from_self_energies,solve_open_system,ScatteringSolution,ScatteringMatrix} and thouless::linear_operator::{gmres_with_right_preconditioner,Ilu0Preconditioner}"
test = "tests/native_transport.rs analytic lead boundaries, ballistic transmission, arbitrary embedded-self-energy spectral identity, dense-versus-sparse Green, Fisher-Lee, transmission, scattering-state, channel, and LDOS equivalence, generated multi-terminal probability conservation, and a 100000-dimensional O(nnz) open chain; compat-tests/test_kwant_api.py 20000-dimensional no-dense-materialization boundary with NumPy inversion, eigendecomposition, and pseudoinversion disabled; complete pinned sparse-solver tests; and the pinned quantum Hall comprehensive workflow"
status = "implemented"

[[capability]]
id = "transport.propagating_modes"
description = "Current-normalized propagating Bloch modes, decaying evanescent modes, and stable regular or generalized translation pencils for square nearest-cell leads, including singular-hopping bases, complete orthogonal conservation-law subspaces, symmetry-related blocks, and discrete-symmetry-adapted gauges"
native_api = "thouless::lead_modes::{setup_lead_linear_system,reexpress_modes_in_singular_hopping_basis,propagating_modes,propagating_modes_in_subspaces,propagating_modes_in_declared_symmetric_subspaces,propagating_modes_with_symmetries,LeadLinearSystem,LeadLinearSystemOptions,PropagatingLeadModes,ProjectedLeadModes}"
test = "src/lead_modes.rs analytic propagating and gapped scalar-chain, stable-pencil dtype and extraction-basis, singular-basis invariance, degenerate-current, rescaling, complex-projector, symmetry-related-block, time-reversal, and particle-hole properties plus compatibility boundary with the SciPy eigensolver disabled"
status = "partial"
issue = "https://github.com/matrixlab-research/thouless/issues/3"

[[capability]]
id = "transport.lead_self_energy"
description = "Retarded self-energies for semi-infinite periodic leads with square, rectangular, or rank-deficient interfaces"
native_api = "thouless::transport::{retarded_lead_self_energy,regularize_retarded_self_energy,square_lattice_self_energy}"
test = "tests/native_transport.rs analytic scalar chain, rectangular interface, causal projection, square-strip differential check, and pinned Kwant lead self-energy workflows"
status = "implemented"

