[package]
name = "thouless"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Rust-native tight-binding, topology, and steady-state quantum transport"
repository = "https://github.com/matrixlab-research/thouless"
readme = "README.md"
keywords = ["tight-binding", "topology", "quantum-transport"]
categories = ["science"]

[workspace]
members = [
  ".",
  "crates/thouless-capi",
  "crates/thouless-lapack",
  "crates/thouless-python",
]
resolver = "2"

[dependencies]
chainrules-core = { version = "0.2.0", features = ["num-complex"] }
faer = { version = "=0.20.1", default-features = false, features = ["std", "linalg"] }
md-5 = "0.10.6"
nalgebra = "0.33.2"
num-complex = "0.4.6"
rustfft = "6.2.0"
thouless-lapack = { version = "0.1.0", path = "crates/thouless-lapack" }
