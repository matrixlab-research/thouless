name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ad:
    name: Native AD correctness and advantage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install the Fortran linker
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Check the complete workspace at the minimum supported Rust version
        run: cargo check --workspace --all-features
      - name: Verify native rules at the minimum supported Rust version
        run: cargo test -p thouless --test native_ad --all-features
      - name: Measure native reverse mode against central finite differences
        run: |
          cargo run --release --quiet --example native_ad_benchmark > native-ad-benchmark.jsonl
          python tools/check_native_ad_benchmark.py native-ad-benchmark.jsonl
      - uses: actions/upload-artifact@v6
        with:
          name: native-ad-benchmark
          path: native-ad-benchmark.jsonl
          if-no-files-found: error

  contracts:
    name: Versioned API contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Rust, C ABI, Julia, and compatibility inventories
        run: |
          python tools/check_contracts.py
          python tools/check_native_api.py --base-ref origin/main
          python tools/check_capi_julia.py
          python tools/check_python_docs.py
          python tools/generate_c_header.py --check

  rust-core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux Fortran linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Lint all public targets
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test the complete Rust workspace
        run: cargo test --workspace --all-features
      - name: Build warning-free documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  python-native:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux Fortran linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Install the wheel builder
        run: python -m pip install maturin==1.14.1
      - name: Build the Python wheel
        run: maturin build --release --out dist
      - name: Install and test only the produced wheel
        run: python tools/test_built_wheel.py

  c-abi:
    name: C ABI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install the Linux Fortran linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build and test the ABI library
        run: |
          cargo test -p thouless-capi
          cargo build --release -p thouless-capi
      - name: Validate the generated header
        run: python tools/generate_c_header.py --check
      - name: Compile and run a C11 client
        run: python tools/run_c_smoke.py --profile release

  julia-native:
    name: Julia ${{ matrix.julia }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia: "1.10"
          - os: ubuntu-latest
            julia: "1"
          - os: macos-latest
            julia: "1"
          - os: windows-latest
            julia: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Install the Linux Fortran linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build and install the exact Julia native artifact
        run: |
          cargo build --release -p thouless-capi
          python tools/install_julia_library.py --profile release
      - name: Test Thouless.jl as an installed package
        run: julia --startup-file=no --project=julia/Thouless -e "using Pkg; Pkg.test()"

  language-parity:
    name: Rust/Python/Julia semantic parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build installed language artifacts
        run: |
          python -m pip install maturin==1.14.1
          maturin build --release --out dist
          python tools/test_built_wheel.py --keep .parity-venv --skip-tests
          cargo build --release -p thouless-capi
          python tools/install_julia_library.py --profile release
      - name: Generate the same scientific cases through each public API
        run: |
          cargo run --release --quiet --example language_conformance > rust-report.txt
          .parity-venv/bin/python python-tests/conformance/report.py > python-report.txt
          julia --startup-file=no --project=julia/Thouless julia/Thouless/test/conformance_report.jl > julia-report.txt
      - name: Compare analytic invariants and cross-language values
        run: python tools/compare_conformance.py rust-report.txt python-report.txt julia-report.txt

  source-compatibility:
    name: PythTB 2.0 and Kwant 1.5 source suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build and install the compatibility wheel
        run: |
          python -m pip install maturin==1.14.1
          maturin build --release --out dist
          python tools/test_built_wheel.py --keep .compat-venv --extra compat-test --skip-tests
      - name: Validate compatibility manifests and smoke contracts
        env:
          PYTHONPATH: ""
          THOULESS_COMPAT_ROOT: ${{ github.workspace }}/.compat-venv/lib/python3.12/site-packages
        run: |
          python tools/check_contracts.py
          .compat-venv/bin/python tools/check_python_api.py
          .compat-venv/bin/python -m pytest -q -ra compat-tests
      - name: Fetch pinned PythTB 2.0
        run: git clone --branch v2.0.0 --depth 1 https://github.com/pythtb/pythtb.git /tmp/pythtb-upstream
      - name: Run all 98 pinned PythTB tests
        env:
          PYTHONPATH: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: .compat-venv/bin/python tools/run_upstream_pythtb.py /tmp/pythtb-upstream
      - name: Fetch pinned Kwant 1.5
        run: git clone --branch v1.5.0 --depth 1 https://gitlab.kwant-project.org/kwant/kwant.git /tmp/kwant-upstream
      - name: Run all 398 pinned Kwant tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          PYTHONPATH: ""
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: .compat-venv/bin/python tools/run_upstream_kwant.py /tmp/kwant-upstream
