name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test native API
        run: cargo test --workspace --all-features
      - name: Build documentation
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  contracts:
    name: Python compatibility and source-test slice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create the compatibility virtual environment
        run: python -m venv .venv
      - name: Install extension builder and test dependencies
        run: >-
          .venv/bin/python -m pip install
          matplotlib==3.8.4
          maturin==1.14.1
          numpy==2.2.6
          plotly==6.9.0
          pytest==8.3.5
          qsymm==1.4.0
          scipy==1.13.1
          setuptools==83.0.0
          sympy==1.14.0
          tinyarray==1.2.5
      - name: Build the repository compatibility extension
        run: .venv/bin/maturin develop
      - name: Validate coverage matrices
        run: .venv/bin/python tools/check_contracts.py
      - name: Run compatibility smoke contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          THOULESS_COMPAT_ROOT: ${{ github.workspace }}/python
        run: .venv/bin/python -m pytest -q -ra compat-tests
      - name: Fetch the pinned PythTB source tests
        run: >-
          git clone
          --branch v2.0.0
          --depth 1
          https://github.com/pythtb/pythtb.git
          /tmp/pythtb-upstream
      - name: Run the strict PythTB 2.0 source-test slice
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          PYTHONDONTWRITEBYTECODE: "1"
        run: .venv/bin/python tools/run_upstream_pythtb.py /tmp/pythtb-upstream
      - name: Fetch the pinned Kwant source tests
        run: >-
          git clone
          --branch v1.5.0
          --depth 1
          https://gitlab.kwant-project.org/kwant/kwant.git
          /tmp/kwant-upstream
      - name: Run the strict Kwant 1.5 source-test slice
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          PYTHONPATH: ${{ github.workspace }}/python
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: .venv/bin/python tools/run_upstream_kwant.py /tmp/kwant-upstream
