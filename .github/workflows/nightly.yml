name: Scheduled ownership, scale, and performance

on:
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    name: Native ownership and leak checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native diagnostics
        run: sudo apt-get update && sudo apt-get install -y gfortran valgrind
      - name: Build the production C ABI
        run: cargo build --release -p thouless-capi
      - name: Check repeated handle creation and destruction under Valgrind
        run: python tools/run_c_smoke.py --profile release --valgrind
      - name: Exercise panic containment, thread-local errors, and concurrent reads
        run: cargo test --release -p thouless-capi

  scientific-scale:
    name: Scientific scale and allocation tracking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the Fortran linker
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run realistic sparse workflows and record metrics
        run: python tools/nightly_metrics.py
      - uses: actions/upload-artifact@v6
        with:
          name: nightly-scientific-metrics
          path: nightly-metrics.json
          if-no-files-found: error
